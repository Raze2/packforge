name: Desktop installers

# Builds unsigned installers for Windows, macOS (universal) and Linux.
# Run manually, or push a tag like v0.2.0 to attach them to a draft GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown
          - name: Windows
            os: windows-latest
            args: ''
            rust_targets: wasm32-unknown-unknown
          - name: Linux
            os: ubuntu-22.04
            args: ''
            rust_targets: wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v4

      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      # Must match the wasm-bindgen version in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('PackForge {0}', github.ref_name) || '' }}
          releaseDraft: true

      # After the build: Tauri embeds apps/web/dist/app at compile time.
      - name: Native file tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - uses: actions/upload-artifact@v4
        with:
          name: packforge-desktop-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
          if-no-files-found: warn
