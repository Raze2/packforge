[package]
name = "packforge-desktop"
description = "PackForge desktop app (Tauri shell around apps/web)"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "LicenseRef-Proprietary"
publish = false

# Standalone workspace: keeps Tauri's platform dependencies out of the core `cargo test`.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pf-core = { path = "../../../crates/pf-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
