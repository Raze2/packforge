[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "LicenseRef-Proprietary"
publish = false
authors = ["PackForge"]

[workspace.dependencies]
pf-geom = { path = "crates/pf-geom" }
pf-model = { path = "crates/pf-model" }
pf-expr = { path = "crates/pf-expr" }
pf-component = { path = "crates/pf-component" }
pf-export = { path = "crates/pf-export" }
pf-fold3d = { path = "crates/pf-fold3d" }
pf-optimize = { path = "crates/pf-optimize" }
pf-license = { path = "crates/pf-license" }
pf-core = { path = "crates/pf-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1

[profile.release.package.pf-wasm]
opt-level = "s"
